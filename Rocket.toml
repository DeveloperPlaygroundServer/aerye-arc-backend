[default]
address = "127.0.0.1"
port = 5432
workers = 16
max_blocking = 512
keep_alive = 0
ident = "Rocket"
ip_header = "X-Real-IP" # set to `false` to disable
log_level = "normal"
temp_dir = "/tmp"
cli_colors = false
# We only need secret_key for private cookies
#secret_key = "hPrYyЭRiMyµ5sBB1π+CMæ1køFsåqKvBiQJxBVHQk="

[default.limits]
form = "64 kB"
json = "1 MiB"
msgpack = "2 MiB"
"file/jpg" = "5 MiB"

# We should do tls at some point
[default.tls]
#certs = "path/to/cert-chain.pem"
#key = "path/to/key.pem"

[default.shutdown]
ctrlc = true
signals = ["term", "hup"]
grace = 5
mercy = 5
